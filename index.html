<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanveer Clean Energy - Solar Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #ecfdf5; color: #064e3b; padding: 20px; }
    .box { background: white; max-width: 480px; margin: auto; padding: 24px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-top: 6px solid #10b981; }
    h1 { margin: 0 0 8px; font-size: 24px; color: #047857; text-align: center; }
    p.sub { text-align: center; color: #475569; font-size: 14px; margin-bottom: 20px; }
    label { font-weight: bold; font-size: 15px; display: block; margin-bottom: 6px; }
    input { width: 100%; padding: 14px; border: 2px solid #a7f3d0; border-radius: 10px; font-size: 18px; box-sizing: border-box; margin-bottom: 16px; }
    button { width: 100%; background: #10b981; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; }
    .result { margin-top: 20px; background: #f0fdf4; padding: 16px; border-radius: 12px; border: 1px solid #86efac; display: none; }
    .stat { font-size: 18px; font-weight: bold; color: #065f46; margin: 8px 0; }
  </style>
</head>
<body>

  <div class="box">
    <h1>☀️ Solar Savings Calculator</h1>
    <p class="sub">Jaanein Solar Panel lagane se aapke kitne paise aur ped bachenge!</p>

    <label>Aapka Mahine ka Bijli Bill (₹ mein):</label>
    <input type="number" id="bill" placeholder="Jaise: 3000">

    <button onclick="calculateSolar()">Bachat Calculate Karein</button>

    <div class="result" id="resBox">
      <div class="stat" id="yearlySave"></div>
      <div class="stat" id="systemSize"></div>
      <div class="stat" id="treesSaved"></div>
    </div>
  </div>

  <script>
    function calculateSolar() {
      var bill = parseFloat(document.getElementById("bill").value);
      if (!bill || bill <= 0) {
        alert("Kripya sahi bijli bill (₹) likhein!");
        return;
      }
      var monthlySave = Math.round(bill * 0.85);
      var yearlySave = monthlySave * 12;
      var kw = Math.max(1, Math.round(bill / 1000));
      var trees = kw * 15;

      document.getElementById("yearlySave").innerText = "💰 Saalana Bachat: ₹" + yearlySave;
      document.getElementById("systemSize").innerText = "⚡ Zaroori Solar System: " + kw + " kW";
      document.getElementById("treesSaved").innerText = "🌳 Har Saal Bachaye Gaye Ped: " + trees + " Ped";
      document.getElementById("resBox").style.display = "block";
    }
  </script>

</body>
</html>
